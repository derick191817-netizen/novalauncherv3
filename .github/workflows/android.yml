name: Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Dar permissão ao Gradle
        run: chmod +x gradlew

      - name: Instalar plataforma e build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Compilar APK debug
        run: ./gradlew :app:assembleDebug --stacktrace --warning-mode all

      - name: Testes unitarios
        if: always()
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Guardar APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Guardar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-de-teste
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          if-no-files-found: ignore
